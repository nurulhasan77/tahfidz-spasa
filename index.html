    /**
     * =========================================================================
     * 1B. TEMPLATE KODE GOOGLE APPS SCRIPT (UNTUK DITEMPEL DI GOOGLE SHEETS)
     * =========================================================================
     */
    const GOOGLE_APPS_SCRIPT_CODE = [
      "/**",
      " * ===========================================================================",
      " * GOOGLE APPS SCRIPT - BACKEND DATABASE SIM-TAHFIDZ",
      " * Cara Pasang:",
      " * 1. Buka Google Spreadsheet Anda -> Menu Ekstensi (Extensions) -> Apps Script",
      " * 2. Hapus kode bawaan, tempel seluruh kode ini, lalu klik Simpan (Ctrl+S)",
      " * 3. Klik Terapkan (Deploy) -> Deployment baru -> Jenis: Aplikasi Web",
      " * 4. Jalankan sebagai: Saya (Me) | Yang memiliki akses: Siapa saja (Anyone)",
      " * 5. Salin URL Web App yang muncul dan tempel di menu Koordinator SIM-TAHFIDZ",
      " * ===========================================================================",
      " */",
      "",
      "var SHEET_SCHEMAS = {",
      "  Kelompok: ['id', 'nama', 'level', 'ustadzId', 'ustadzNama', 'wa'],",
      "  Siswa: ['id', 'nis', 'nama', 'kelas', 'jenjang', 'level', 'kelompokId', 'waliNama', 'waliWa'],",
      "  Users: ['username', 'password', 'role', 'name', 'title', 'kelompokId', 'siswaId'],",
      "  Absensi: ['key', 'tanggal', 'siswaId', 'status', 'isTelat', 'updatedBy'],",
      "  Jurnal: ['id', 'tanggal', 'siswaId', 'ustadzId', 'ustadzNama', 'jenis', 'suratNo', 'suratNama', 'ayatMulai', 'ayatSelesai', 'nasehat'],",
      "  Hafalan: ['id', 'siswaId', 'suratNo', 'suratNama', 'ayatMulai', 'ayatSelesai', 'totalAyat', 'status', 'tanggal'],",
      "  SavedBatches: ['batchKey', 'savedAt', 'savedBy']",
      "};",
      "",
      "function getOrCreateSheet(ss, sheetName) {",
      "  var sheet = ss.getSheetByName(sheetName);",
      "  var headers = SHEET_SCHEMAS[sheetName];",
      "  if (!sheet) {",
      "    sheet = ss.insertSheet(sheetName);",
      "    if (headers && headers.length > 0) {",
      "      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);",
      "      sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#065f46').setFontColor('#ffffff');",
      "      sheet.setFrozenRows(1);",
      "    }",
      "  }",
      "  return sheet;",
      "}",
      "",
      "function readSheetRows(ss, sheetName) {",
      "  var sheet = ss.getSheetByName(sheetName);",
      "  if (!sheet) return [];",
      "  var lastRow = sheet.getLastRow();",
      "  var lastCol = sheet.getLastColumn();",
      "  if (lastRow < 2 || lastCol < 1) return [];",
      "  var values = sheet.getRange(1, 1, lastRow, lastCol).getValues();",
      "  var headers = values[0];",
      "  var list = [];",
      "  for (var r = 1; r < values.length; r++) {",
      "    var rowObj = {};",
      "    var hasContent = false;",
      "    for (var c = 0; c < headers.length; c++) {",
      "      var key = String(headers[c]).trim();",
      "      if (!key) continue;",
      "      var val = values[r][c];",
      "      if (val !== '' && val !== null && val !== undefined) hasContent = true;",
      "      rowObj[key] = val;",
      "    }",
      "    if (hasContent) list.push(rowObj);",
      "  }",
      "  return list;",
      "}",
      "",
      "function writeSheetRows(ss, sheetName, rows) {",
      "  var sheet = getOrCreateSheet(ss, sheetName);",
      "  var headers = SHEET_SCHEMAS[sheetName];",
      "  sheet.clearContents();",
      "  sheet.getRange(1, 1, 1, headers.length).setValues([headers]);",
      "  sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#065f46').setFontColor('#ffffff');",
      "  sheet.setFrozenRows(1);",
      "  if (!rows || rows.length === 0) return;",
      "  var matrix = rows.map(function(item) {",
      "    return headers.map(function(h) {",
      "      var v = item[h];",
      "      return (v === undefined || v === null) ? '' : v;",
      "    });",
      "  });",
      "  sheet.getRange(2, 1, matrix.length, headers.length).setValues(matrix);",
      "}",
      "",
      "function jsonResponse(payload) {",
      "  return ContentService.createTextOutput(JSON.stringify(payload)).setMimeType(ContentService.MimeType.JSON);",
      "}",
      "",
      "// Endpoint GET: Menarik seluruh data dari Google Spreadsheet ke Aplikasi Web/APK",
      "function doGet(e) {",
      "  try {",
      "    var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "    var data = {",
      "      kelompok: readSheetRows(ss, 'Kelompok'),",
      "      students: readSheetRows(ss, 'Siswa'),",
      "      users: readSheetRows(ss, 'Users'),",
      "      attendance: readSheetRows(ss, 'Absensi'),",
      "      jurnal: readSheetRows(ss, 'Jurnal'),",
      "      hafalan: readSheetRows(ss, 'Hafalan'),",
      "      savedBatches: readSheetRows(ss, 'SavedBatches')",
      "    };",
      "    return jsonResponse({ status: 'ok', timestamp: new Date().toISOString(), data: data });",
      "  } catch (err) {",
      "    return jsonResponse({ status: 'error', message: String(err) });",
      "  }",
      "}",
      "",
      "// Endpoint POST: Menerima & menyimpan data dari Aplikasi Web/APK ke Google Spreadsheet",
      "function doPost(e) {",
      "  try {",
      "    var body = JSON.parse(e.postData.contents);",
      "    var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "    var d = body.data || {};",
      "    if (d.kelompok) writeSheetRows(ss, 'Kelompok', d.kelompok);",
      "    if (d.students) writeSheetRows(ss, 'Siswa', d.students);",
      "    if (d.users) writeSheetRows(ss, 'Users', d.users);",
      "    if (d.attendance) writeSheetRows(ss, 'Absensi', d.attendance);",
      "    if (d.jurnal) writeSheetRows(ss, 'Jurnal', d.jurnal);",
      "    if (d.hafalan) writeSheetRows(ss, 'Hafalan', d.hafalan);",
      "    if (d.savedBatches) writeSheetRows(ss, 'SavedBatches', d.savedBatches);",
      "    return jsonResponse({ status: 'ok', timestamp: new Date().toISOString() });",
      "  } catch (err) {",
      "    return jsonResponse({ status: 'error', message: String(err) });",
      "  }",
      "}"
    ].join("\n");

        } else if (s.level === 2) {

              suratNama: sur.nama,
              ayatMulai: 1,
              ayatSelesai: sur.ayat,
              totalAyat: sur.ayat,
              status: "Khatam",
              tanggal: "2026-11-10"

          const j29Count = 2 + (idx % 5);
          for (let k = 0; k < j29Count; k++) {

              suratNo: sur.no,
              suratNama: sur.nama,

              ayatSelesai: sur.ayat,
              totalAyat: sur.ayat,
              status: "Khatam",

              suratNo: sedangSur.no,
              suratNama: sedangSur.nama,
              ayatMulai: 1,
              ayatSelesai: Math.max(1, sampai),
              totalAyat: Math.max(1, sampai),
              status: "Sedang Dihafal",
              tanggal: TODAY_DATE
            });
          }
        } else {

          [...juz30Sorted, ...juz29Sorted].forEach(sur => {
            hafalan.push({
              id: `H_${s.id}_${sur.no}`,
              siswaId: s.id,
              suratNo: sur.no,
              suratNama: sur.nama,
              ayatMulai: 1,
              ayatSelesai: sur.ayat,
              totalAyat: sur.ayat,
              status: "Khatam",
              tanggal: "2026-11-05"
            });
          });
          const alFatihah = SURAH_LIST.find(x => x.no === 1);
          hafalan.push({
            id: `H_${s.id}_1`,
            siswaId: s.id,
            suratNo: 1,
            suratNama: alFatihah.nama,
            ayatMulai: 1,
            ayatSelesai: 7,
            totalAyat: 7,
            status: "Khatam",
            tanggal: "2026-11-12"
          });
          const baqarahAyat = 45 + ((idx * 13) % 120);
          hafalan.push({
            id: `H_${s.id}_2`,

            suratNo: 2,
            suratNama: "Al-Baqarah",
            ayatMulai: 1,
            ayatSelesai: baqarahAyat,
            totalAyat: baqarahAyat,
            status: "Sedang Dihafal",
            tanggal: TODAY_DATE

        }

        // Contoh Absensi & Jurnal Hari Ini untuk simulasi siap pakai
        const key = `${TODAY_DATE}_${s.id}`;
        const kelObj = KELOMPOK_LIST.find(k => k.id === s.kelompokId);

        if (idx % 19 === 0) {
          attendance[key] = { tanggal: TODAY_DATE, siswaId: s.id, status: "I", isTelat: false, updatedBy: "Tim Koordinator 1" };
        } else if (idx % 23 === 0) {
          attendance[key] = { tanggal: TODAY_DATE, siswaId: s.id, status: "S", isTelat: false, updatedBy: "Tim Koordinator 1" };
        } else if (idx % 29 === 0) {
          attendance[key] = { tanggal: TODAY_DATE, siswaId: s.id, status: "D", isTelat: false, updatedBy: "Tim Koordinator 2" };
        } else if (idx % 37 === 0) {
          attendance[key] = { tanggal: TODAY_DATE, siswaId: s.id, status: "A", isTelat: false, updatedBy: "Tim Koordinator 2" };
        } else {
          const isTelat = idx % 11 === 0;
          attendance[key] = {
            tanggal: TODAY_DATE,
            siswaId: s.id,
            status: "H",
            isTelat,
            updatedBy: kelObj ? kelObj.ustadzNama : "Ustadz Pembina"
          };

          const sedang = hafalan.find(h => h.siswaId === s.id && h.status === "Sedang Dihafal");
          if (idx % 5 === 0) {
            jurnal.push({
              id: `J_${s.id}_TODAY`,
              tanggal: TODAY_DATE,
              siswaId: s.id,
              ustadzId: kelObj.ustadzId,
              ustadzNama: kelObj.ustadzNama,
              jenis: "Murojaah",
              suratNo: sedang ? sedang.suratNo : 114,
              suratNama: sedang ? sedang.suratNama : "An-Nas",
              ayatMulai: 1,
              ayatSelesai: sedang ? sedang.ayatSelesai : 6,
              nasehat: "Pertahankan kelancaran makhraj dan mad saat murojaah di rumah bersama orang tua."
            });
          } else if (idx % 7 === 0) {
            jurnal.push({
              id: `J_${s.id}_TODAY`,
              tanggal: TODAY_DATE,
              siswaId: s.id,
              ustadzId: kelObj.ustadzId,
              ustadzNama: kelObj.ustadzNama,
              jenis: "Tidak Setoran",
              suratNo: null,
              suratNama: "-",
              ayatMulai: null,
              ayatSelesai: null,
              nasehat: "Hadir menyimak halaqah, besok siap menyetorkan ayat lanjutan."
            });
          } else if (sedang) {
            jurnal.push({
              id: `J_${s.id}_TODAY`,
              tanggal: TODAY_DATE,
              siswaId: s.id,
              ustadzId: kelObj.ustadzId,
              ustadzNama: kelObj.ustadzNama,
              jenis: "Ziyadah",
              suratNo: sedang.suratNo,
              suratNama: sedang.suratNama,
              ayatMulai: Math.max(1, sedang.ayatSelesai - 2),
              ayatSelesai: sedang.ayatSelesai,
              nasehat: "MasyaAllah, setoran lancar dan tartil. Lanjutkan 3 ayat berikutnya."
            });
          }
        }
      });

      KELOMPOK_LIST.forEach(k => {
        savedBatches[`${TODAY_DATE}_K${k.id}`] = {
          savedAt: "14:15 WIB",
          savedBy: k.ustadzNama
        };
      });

      return { students, users, hafalan, jurnal, attendance, savedBatches };
    }

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.students) && parsed.students.length > 0) {
            if (!parsed.savedBatches) parsed.savedBatches = {};
            return parsed;
          }
        }
      } catch (e) {
        console.warn("Gagal membaca localStorage, membuat database awal.", e);
      }
      const initial = buildInitialDatabase();
      saveDatabase(initial, false);
      return initial;
    }

    function saveDatabase(targetDb = db, shouldAutoPush = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(targetDb));
      } catch (e) {
        console.warn("Gagal menyimpan ke localStorage.", e);
      }
      if (shouldAutoPush && sheetsConfig.scriptUrl) {
        pushDataToGoogleSheets(true);
      }
    }

    function loadSheetsConfig() {
      try {
        const raw = localStorage.getItem(SHEETS_CONFIG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            return {
              scriptUrl: parsed.scriptUrl || "",
              lastSyncAt: parsed.lastSyncAt || "",
              autoPush: parsed.autoPush !== false
            };
          }
        }
      } catch (e) {
        console.warn("Gagal membaca konfigurasi Google Sheets.", e);
      }
      return { scriptUrl: "", lastSyncAt: "", autoPush: true };
    }

    function saveSheetsConfig(cfg = sheetsConfig) {
      try {
        localStorage.setItem(SHEETS_CONFIG_KEY, JSON.stringify(cfg));
      } catch (e) {
        console.warn("Gagal menyimpan konfigurasi Google Sheets.", e);
      }
    }

    let sheetsConfig = loadSheetsConfig();
    let db = loadDatabase();

    /**
     * =========================================================================
     * 2B. ENGINE SINKRONISASI DUA ARAH DENGAN GOOGLE SPREADSHEET
     * =========================================================================
     */
    function setSyncButtonSpinning(isSpinning) {
      const icon = document.getElementById("icon-sync-sheets");
      const btn = document.getElementById("btn-sync-sheets");
      if (icon) {
        if (isSpinning) icon.classList.add("fa-spin");
        else icon.classList.remove("fa-spin");
      }
      if (btn) {
        btn.disabled = isSpinning;
      }
    }

    function formatNowWIB() {
      const now = new Date();
      return String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + " WIB";
    }

    function buildSerializableSheetsPayload() {
      const attendanceRows = Object.entries(db.attendance).map(([key, item]) => ({
        key,
        tanggal: item.tanggal,
        siswaId: item.siswaId,
        status: item.status,
        isTelat: item.isTelat ? "TRUE" : "FALSE",
        updatedBy: item.updatedBy || ""
      }));

      const savedBatchRows = Object.entries(db.savedBatches || {}).map(([batchKey, meta]) => ({
        batchKey,
        savedAt: meta.savedAt || "",
        savedBy: meta.savedBy || ""
      }));

      return {
        kelompok: KELOMPOK_LIST,
        students: db.students,
        users: db.users,
        attendance: attendanceRows,
        jurnal: db.jurnal,
        hafalan: db.hafalan,
        savedBatches: savedBatchRows
      };
    }

    async function pushDataToGoogleSheets(isSilent = false) {
      if (!sheetsConfig.scriptUrl) {
        if (!isSilent) showToast("URL Web App Google Spreadsheet belum diatur.", "warning");
        return false;
      }

      setSyncButtonSpinning(true);
      try {
        const response = await fetch(sheetsConfig.scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "pushAll",
            data: buildSerializableSheetsPayload()
          })
        });
        const result = await response.json();
        if (result && result.status === "ok") {
          sheetsConfig.lastSyncAt = formatNowWIB();
          saveSheetsConfig();
          if (!isSilent) {
            showToast("Data berhasil dikirim & tersimpan di Google Spreadsheet!", "success");
          }
          renderApp();
          return true;
        } else {
          throw new Error(result?.message || "Respons server tidak valid");
        }
      } catch (err) {
        console.error("Gagal kirim ke Google Sheets:", err);
        if (!isSilent) {
          showToast("Gagal mengirim data ke Google Sheets. Periksa URL Web App & koneksi internet.", "error");
        }
        return false;
      } finally {
        setSyncButtonSpinning(false);
      }
    }

    async function pullDataFromGoogleSheets(isSilent = false) {
      if (!sheetsConfig.scriptUrl) {
        if (!isSilent) showToast("URL Web App Google Spreadsheet belum diatur.", "warning");
        return false;
      }

      setSyncButtonSpinning(true);
      try {
        const sep = sheetsConfig.scriptUrl.includes("?") ? "&" : "?";
        const response = await fetch(`${sheetsConfig.scriptUrl}${sep}action=pull&t=${Date.now()}`, {
          method: "GET",
          redirect: "follow"
        });
        const result = await response.json();
        if (!result || result.status !== "ok" || !result.data) {
          throw new Error(result?.message || "Gagal membaca data dari Spreadsheet");
        }

        const remote = result.data;

        if (Array.isArray(remote.kelompok) && remote.kelompok.length > 0) {
          const normalizedKel = remote.kelompok.map(k => ({
            id: parseInt(k.id, 10),
            nama: String(k.nama || ""),
            level: parseInt(k.level, 10) || 1,
            ustadzId: String(k.ustadzId || ""),
            ustadzNama: String(k.ustadzNama || ""),
            wa: String(k.wa || "")
          }));
          KELOMPOK_LIST.splice(0, KELOMPOK_LIST.length, ...normalizedKel);
        }

        if (Array.isArray(remote.students) && remote.students.length > 0) {
          db.students = remote.students.map(s => {
            const kelasStr = String(s.kelas || "7A");
            return {
              id: String(s.id),
              nis: String(s.nis || ""),
              nama: String(s.nama || ""),
              kelas: kelasStr,
              jenjang: parseInt(s.jenjang, 10) || parseInt(kelasStr.charAt(0), 10) || 7,
              level: parseInt(s.level, 10) || 1,
              kelompokId: parseInt(s.kelompokId, 10) || 1,
              waliNama: String(s.waliNama || ""),
              waliWa: String(s.waliWa || "")
            };
          });
        }

        if (Array.isArray(remote.users) && remote.users.length > 0) {
          db.users = remote.users.map(u => ({
            username: String(u.username || ""),
            password: String(u.password || "123"),
            role: String(u.role || "siswa"),
            name: String(u.name || ""),
            title: String(u.title || ""),
            kelompokId: u.kelompokId !== "" && u.kelompokId !== undefined ? parseInt(u.kelompokId, 10) : undefined,
            siswaId: u.siswaId ? String(u.siswaId) : undefined
          }));
        }

        if (Array.isArray(remote.attendance)) {
          const attMap = {};
          remote.attendance.forEach(a => {
            const tgl = String(a.tanggal || "").slice(0, 10);
            const sid = String(a.siswaId || "");
            const key = a.key ? String(a.key) : `${tgl}_${sid}`;
            if (tgl && sid) {
              attMap[key] = {
                tanggal: tgl,
                siswaId: sid,
                status: String(a.status || "H"),
                isTelat: String(a.isTelat).toUpperCase() === "TRUE" || a.isTelat === true,
                updatedBy: String(a.updatedBy || "Google Sheets")
              };
            }
          });
          db.attendance = attMap;
        }

        if (Array.isArray(remote.jurnal)) {
          db.jurnal = remote.jurnal.map(j => ({
            id: String(j.id || "J" + Math.random()),
            tanggal: String(j.tanggal || "").slice(0, 10),
            siswaId: String(j.siswaId || ""),
            ustadzId: String(j.ustadzId || ""),
            ustadzNama: String(j.ustadzNama || ""),
            jenis: String(j.jenis || "Ziyadah"),
            suratNo: j.suratNo !== "" && j.suratNo !== null ? parseInt(j.suratNo, 10) : null,
            suratNama: String(j.suratNama || "-"),
            ayatMulai: j.ayatMulai !== "" && j.ayatMulai !== null ? parseInt(j.ayatMulai, 10) : null,
            ayatSelesai: j.ayatSelesai !== "" && j.ayatSelesai !== null ? parseInt(j.ayatSelesai, 10) : null,
            nasehat: String(j.nasehat || "")
          }));
        }

        if (Array.isArray(remote.hafalan)) {
          db.hafalan = remote.hafalan.map(h => ({
            id: String(h.id || "H" + Math.random()),
            siswaId: String(h.siswaId || ""),
            suratNo: parseInt(h.suratNo, 10) || 114,
            suratNama: String(h.suratNama || ""),
            ayatMulai: parseInt(h.ayatMulai, 10) || 1,
            ayatSelesai: parseInt(h.ayatSelesai, 10) || 1,
            totalAyat: parseInt(h.totalAyat, 10) || 1,
            status: String(h.status || "Sedang Dihafal"),
            tanggal: String(h.tanggal || TODAY_DATE).slice(0, 10)
          }));
        }

        if (Array.isArray(remote.savedBatches)) {
          const batchMap = {};
          remote.savedBatches.forEach(b => {
            if (b.batchKey) {
              batchMap[String(b.batchKey)] = {
                savedAt: String(b.savedAt || ""),
                savedBy: String(b.savedBy || "")
              };
            }
          });
          db.savedBatches = batchMap;
        }

        saveDatabase(db, false);
        sheetsConfig.lastSyncAt = formatNowWIB();
        saveSheetsConfig();
        if (!isSilent) {
          showToast("Sinkronisasi berhasil! Data terbaru dari Google Spreadsheet telah dimuat.", "success");
        }
        renderApp();
        return true;
      } catch (err) {
        console.error("Gagal tarik dari Google Sheets:", err);
        if (!isSilent) {
          showToast("Gagal menarik data dari Google Sheets. Pastikan URL Web App benar & berakses 'Siapa saja'.", "error");
        }
        return false;
      } finally {
        setSyncButtonSpinning(false);
      }
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-800 text-white border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "fa-circle-check text-emerald-400",
        error: "fa-circle-exclamation text-rose-400",
        warning: "fa-triangle-exclamation text-amber-300",
        info: "fa-circle-info text-sky-400"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs font-semibold flex items-center gap-2.5 animate-toast ${styles[type] || styles.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm shrink-0"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.25s ease";
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    function openModal(htmlContent, maxWidthClass = "max-w-lg") {
      const modal = document.getElementById("custom-modal");

      if (!modal || !card) return;
      card.className = `bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden animate-toast`;
      card.innerHTML = htmlContent;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("custom-modal");
      if (!modal) return;
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function copyTextToClipboard(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Berhasil disalin ke clipboard!", "success");
      } catch (e) {
        showToast("Gagal menyalin teks.", "error");
      }
    }

    function getAttendanceRecord(siswaId, tanggal = uiState.selectedDate) {
      const key = `${tanggal}_${siswaId}`;

    function handleAttendanceClick(siswaId, code) {
      const tanggal = uiState.selectedDate;
      const key = `${tanggal}_${siswaId}`;
      const actor = uiState.currentUser ? uiState.currentUser.name : "Petugas";
      const existing = db.attendance[key];
      const student = db.students.find(s => s.id === siswaId);

      if (code === "TL") {
        if (!existing) {
          db.attendance[key] = { tanggal, siswaId, status: "TL", isTelat: true, updatedBy: actor };
        } else if (existing.isTelat) {
          if (existing.status === "TL") {
            delete db.attendance[key];
          } else {
            db.attendance[key] = { ...existing, isTelat: false, updatedBy: actor };
          }
        } else {
          if (existing.status === "H") {
            db.attendance[key] = { ...existing, status: "H", isTelat: true, updatedBy: actor };
          } else {
            db.attendance[key] = { tanggal, siswaId, status: "TL", isTelat: true, updatedBy: actor };
          }
        }
      } else if (code === "H") {
        if (existing && existing.status === "H" && !existing.isTelat) {
          delete db.attendance[key];
        } else if (existing && existing.status === "H" && existing.isTelat) {
          db.attendance[key] = { ...existing, status: "TL", isTelat: true, updatedBy: actor };
        } else {
          const keepTelat = existing ? existing.isTelat : false;
          db.attendance[key] = { tanggal, siswaId, status: "H", isTelat: keepTelat, updatedBy: actor };
        }
      } else {
        // I, S, D, A bersifat eksklusif (menghapus status lain & reset isTelat)
        if (existing && existing.status === code && !existing.isTelat) {
          delete db.attendance[key];
        } else {
          db.attendance[key] = { tanggal, siswaId, status: code, isTelat: false, updatedBy: actor };
        }
      }

      if (student) {
        uiState.unsavedKelompok[`${tanggal}_K${student.kelompokId}`] = true;
      }

      saveDatabase(db, false);
      renderApp();
    }

    /**
     * =========================================================================
     * 6. PERHITUNGAN CAPAIAN HAFALAN & PERINGKAT (RANKING) GLOBAL
     * =========================================================================
     */
    function computeStudentHafalanSummary(siswaId) {
      const entries = db.hafalan.filter(h => h.siswaId === siswaId);
      const khatamList = entries
        .filter(h => h.status === "Khatam")
        .sort((a, b) => a.suratNo - b.suratNo);
      const sedang = entries.find(h => h.status === "Sedang Dihafal") || null;

      let totalAyat = 0;
      khatamList.forEach(k => {
        totalAyat += Number(k.totalAyat || 0);
      });
      if (sedang) {
        totalAyat += Number(sedang.totalAyat || 0);
      }

      return {
        khatamList,
        khatamCount: khatamList.length,
        sedang,
        totalAyat
      };
    }

    function getRankedStudentsHafalan() {
      const q = uiState.searchQuery.trim().toLowerCase();
      const filtered = db.students.filter(s => {
        if (uiState.selectedKelompok !== "ALL" && String(s.kelompokId) !== String(uiState.selectedKelompok)) return false;
        if (uiState.selectedLevel !== "ALL" && String(s.level) !== String(uiState.selectedLevel)) return false;
        if (uiState.selectedKelas !== "ALL" && s.kelas !== uiState.selectedKelas) return false;
        if (q && !s.nama.toLowerCase().includes(q) && !s.kelas.toLowerCase().includes(q)) return false;
        return true;
      });

      const enriched = filtered.map(s => {
        const summary = computeStudentHafalanSummary(s.id);
        const kel = KELOMPOK_LIST.find(k => k.id === s.kelompokId);
        return {
          ...s,
          kelNama: kel ? kel.nama : `Kelompok ${s.kelompokId}`,
          ustadzNama: kel ? kel.ustadzNama : "-",
          ...summary
        };
      });

      // Urutkan: Total Ayat Terbanyak -> Jumlah Surat Khatam Terbanyak -> Nama
      enriched.sort((a, b) => {
        if (b.totalAyat !== a.totalAyat) return b.totalAyat - a.totalAyat;
        if (b.khatamCount !== a.khatamCount) return b.khatamCount - a.khatamCount;
        return a.nama.localeCompare(b.nama);
      });

      return enriched.map((item, index) => ({
        ...item,
        rank: index + 1
      }));
    }

          <div class="space-y-3 overflow-y-auto pr-1 flex-1">

    function getFilteredStudentsForRekap() {
      const q = uiState.searchQuery.trim().toLowerCase();
      return db.students.filter(s => {
        if (uiState.selectedKelompok !== "ALL" && String(s.kelompokId) !== String(uiState.selectedKelompok)) return false;
        if (uiState.selectedLevel !== "ALL" && String(s.level) !== String(uiState.selectedLevel)) return false;
        if (uiState.selectedKelas !== "ALL" && s.kelas !== uiState.selectedKelas) return false;
        if (q && !s.nama.toLowerCase().includes(q) && !s.kelas.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function getStudentDailyJurnalBadge(siswaId, tanggal = uiState.selectedDate) {
      const j = db.jurnal.find(item => item.siswaId === siswaId && item.tanggal === tanggal);
      if (!j) return "";
      if (j.jenis === "Ziyadah") {
        return `<span class="inline-block mt-1 px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-900 border border-emerald-300 text-[10px] font-bold">Setoran: QS. ${j.suratNama} Ayat ${j.ayatMulai}–${j.ayatSelesai}</span>`;
      }
      if (j.jenis === "Murojaah") {
        return `<span class="inline-block mt-1 px-2 py-0.5 rounded-md bg-sky-100 text-sky-900 border border-sky-300 text-[10px] font-bold">Murojaah: QS. ${j.suratNama} Ayat ${j.ayatMulai}–${j.ayatSelesai}</span>`;
      }
      return `<span class="inline-block mt-1 px-2 py-0.5 rounded-md bg-slate-200 text-slate-800 border border-slate-300 text-[10px] font-bold">Tidak Setoran</span>`;
    }

    function copyDailyWaReport() {
      const tgl = uiState.selectedDate;
      const list = getFilteredStudentsForRekap();
      const hadir = [];
      const telat = [];
      const ijin = [];
      const sakit = [];
      const dispen = [];
      const alpha = [];

      list.forEach(s => {
        const rec = getAttendanceRecord(s.id, tgl);
        if (!rec) return;
        const j = db.jurnal.find(x => x.siswaId === s.id && x.tanggal === tgl);
        let ketJurnal = "";
        if (j) {
          if (j.jenis === "Ziyadah") ketJurnal = ` [Setoran: QS. ${j.suratNama} ${j.ayatMulai}-${j.ayatSelesai}]`;
          else if (j.jenis === "Murojaah") ketJurnal = ` [Murojaah: QS. ${j.suratNama} ${j.ayatMulai}-${j.ayatSelesai}]`;
          else ketJurnal = ` [Tidak Setoran]`;
        }

        if (rec.status === "H") {
          hadir.push(`- ${s.nama} (${s.kelas})${rec.isTelat ? " [TELAT]" : ""}${ketJurnal}`);
        }
        if (rec.isTelat || rec.status === "TL") {
          telat.push(`- ${s.nama} (${s.kelas})`);
        }
        if (rec.status === "I") ijin.push(`- ${s.nama} (${s.kelas})`);
        if (rec.status === "S") sakit.push(`- ${s.nama} (${s.kelas})`);
        if (rec.status === "D") dispen.push(`- ${s.nama} (${s.kelas})`);
        if (rec.status === "A") alpha.push(`- ${s.nama} (${s.kelas})`);
      });

      const lines = [
        `*LAPORAN KEHADIRAN TAHFIDZ HARIAN*`,
        `Tanggal: ${tgl}`,
        `Total Santri Terpantau: ${list.length}`,
        ``,
        `1. *HADIR (${hadir.length})*`,
        ...(hadir.length ? hadir : ["- Nihil"]),
        ``,
        `2. *TELAT (${telat.length})*`,
        ...(telat.length ? telat : ["- Nihil"]),
        ``,
        `3. *IJIN (${ijin.length})*`,
        ...(ijin.length ? ijin : ["- Nihil"]),
        ``,
        `4. *SAKIT (${sakit.length})*`,
        ...(sakit.length ? sakit : ["- Nihil"]),
        ``,
        `5. *DISPEN (${dispen.length})*`,
        ...(dispen.length ? dispen : ["- Nihil"]),
        ``,
        `6. *ALPHA (${alpha.length})*`,
        ...(alpha.length ? alpha : ["- Nihil"])
      ];

      copyTextToClipboard(lines.join("\n"));
    }

    function exportRekapCSV() {
      const tgl = uiState.selectedDate;
      const list = getFilteredStudentsForRekap();
      const rows = [["NIS", "Nama Siswa", "Kelas", "Level", "Kelompok", "Status Kehadiran", "Keterangan Telat", "Kegiatan Hari Ini", "Petugas"]];
      list.forEach(s => {

          else keg = "Tidak Setoran";

                    <div class="text-xs text-slate-600 mt-0.5 flex flex-wrap items-center gap-1.5">

                      <button

          <!-- Daftar Peringkat (1 Kolom di HP/APK, Tabel Lengkap di Web) -->
          ${isApk ? `

                    <div class="flex items-start justify-between gap-2">

                    <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-slate-100 text-[11px]">

                      <span class="text-slate-600 font-semibold">

          ` : `

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">

                  <tbody class="divide-y divide-slate-100">
                    ${rankedList.map(r => {

                          <td class="py-2.5 px-3.5">

    /**
     * =========================================================================
     * 9. MODUL ABSENSI (DROPDOWN NAMA USTADZ PEMBINA & TOMBOL SIMPAN ABSEN)
     * =========================================================================
     */
    function renderAttendanceModule() {
      const isApk = uiState.viewportMode === "apk";
      const tgl = uiState.selectedDate;
      const q = uiState.searchQuery.trim().toLowerCase();

      const targetKelompoks = KELOMPOK_LIST.filter(k => {
        if (uiState.selectedKelompok !== "ALL" && String(k.id) !== String(uiState.selectedKelompok)) return false;
        if (uiState.selectedLevel !== "ALL" && String(k.level) !== String(uiState.selectedLevel)) return false;
        return true;
      });

      const buttonDefs = [
        { code: "H", label: "Hadir", activeBg: "bg-emerald-600 text-white border-emerald-600" },
        { code: "TL", label: "Telat", activeBg: "bg-amber-500 text-white border-amber-500" },
        { code: "I", label: "Ijin", activeBg: "bg-sky-600 text-white border-sky-600" },
        { code: "S", label: "Sakit", activeBg: "bg-purple-600 text-white border-purple-600" },
        { code: "D", label: "Dispen", activeBg: "bg-indigo-600 text-white border-indigo-600" },
        { code: "A", label: "Alpha", activeBg: "bg-rose-600 text-white border-rose-600" }
      ];

      return `
        <div class="space-y-4">
          <!-- Panel Filter Absensi -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-3">
            <div>
              <h2 class="text-sm sm:text-base font-extrabold text-slate-900">Input Absensi Harian Santri</h2>
              <p class="text-xs text-slate-500">Pilih Nama Ustadz Pembina, tandai kehadiran (<strong>H + TL</strong> dapat dikombinasikan), lalu tekan <strong>Simpan Absen</strong> pada kelompok tersebut.</p>
            </div>

            <div class="grid ${isApk ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-2 lg:grid-cols-4"} gap-2.5">
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Tanggal Pertemuan</label>
                <input
                  type="date"
                  value="${uiState.selectedDate}"
                  onchange="uiState.selectedDate = this.value; renderApp();"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                />
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Nama Ustadz Pembina</label>
                <select
                  onchange="uiState.selectedKelompok = this.value; renderApp();"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                >
                  <option value="ALL" ${uiState.selectedKelompok === "ALL" ? "selected" : ""}>Semua Ustadz Pembina (8 Kelompok)</option>
                  ${KELOMPOK_LIST.map(k => `
                    <option value="${k.id}" ${String(uiState.selectedKelompok) === String(k.id) ? "selected" : ""}>
                      ${k.ustadzNama} (${k.nama} • Lvl ${k.level})
                    </option>
                  `).join("")}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Filter Level</label>
                <select
                  onchange="uiState.selectedLevel = this.value; renderApp();"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                >
                  <option value="ALL" ${uiState.selectedLevel === "ALL" ? "selected" : ""}>Semua Level</option>
                  <option value="1" ${uiState.selectedLevel === "1" ? "selected" : ""}>Level 1 (Dasar)</option>
                  <option value="2" ${uiState.selectedLevel === "2" ? "selected" : ""}>Level 2 (Menengah)</option>
                  <option value="3" ${uiState.selectedLevel === "3" ? "selected" : ""}>Level 3 (Lanjutan)</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Cari Nama Siswa</label>
                <input
                  type="text"
                  value="${uiState.searchQuery}"
                  oninput="uiState.searchQuery = this.value; renderApp();"
                  placeholder="Ketik nama siswa..."
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                />
              </div>
            </div>
          </div>

          <!-- Daftar Kelompok Binaan -->
          ${targetKelompoks.map(kel => {
            const members = db.students.filter(s => {
              if (s.kelompokId !== kel.id) return false;
              if (q && !s.nama.toLowerCase().includes(q) && !s.kelas.toLowerCase().includes(q)) return false;
              return true;
            });

            if (members.length === 0) return "";

            const batchKey = `${tgl}_K${kel.id}`;
            const isUnsaved = Boolean(uiState.unsavedKelompok[batchKey]);
            const savedMeta = db.savedBatches[batchKey];
            const markedCount = members.filter(m => Boolean(getAttendanceRecord(m.id, tgl))).length;

            return `
              <div class="bg-white rounded-3xl border ${isUnsaved ? "border-amber-300" : "border-slate-200"} shadow-xs overflow-hidden">
                <!-- Header Kelompok Binaan -->
                <div class="bg-slate-50 px-4 py-3.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs sm:text-sm font-extrabold text-slate-900">${kel.nama} — ${kel.ustadzNama}</span>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold border ${LEVEL_INFO[kel.level].badge}">Level ${kel.level}</span>
                    </div>
                    <div class="text-[11px] text-slate-500 mt-0.5">
                      Terabsen: <strong>${markedCount} / ${members.length} santri</strong>
                      ${savedMeta ? ` • Disimpan pukul ${savedMeta.savedAt} (${savedMeta.savedBy})` : ""}
                    </div>
                  </div>

                  <div>
                    ${isUnsaved ? `
                      <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-extrabold">
                        <i class="fa-solid fa-circle-dot mr-1"></i>Perubahan Belum Disimpan
                      </span>
                    ` : `
                      <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 text-[10px] font-extrabold">
                        <i class="fa-solid fa-circle-check mr-1"></i>Absen Tersimpan
                      </span>
                    `}
                  </div>
                </div>

                <!-- Grid Kartu Siswa (1 Kolom di HP/APK, 2 Kolom di Web) -->
                <div class="p-3.5 sm:p-4 grid ${isApk ? "grid-cols-1" : "grid-cols-1 md:grid-cols-2"} gap-3">
                  ${members.map((s, idx) => {
                    const rec = getAttendanceRecord(s.id, tgl);
                    let statusBadge = `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-bold">Belum Diabsen</span>`;
                    if (rec) {
                      if (rec.status === "H" && rec.isTelat) {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-extrabold">H + TL (Hadir Telat)</span>`;
                      } else if (rec.status === "H") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 text-[10px] font-extrabold">H (Hadir)</span>`;
                      } else if (rec.status === "TL") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-extrabold">TL (Telat)</span>`;
                      } else if (rec.status === "I") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 text-[10px] font-extrabold">I (Ijin)</span>`;
                      } else if (rec.status === "S") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-300 text-[10px] font-extrabold">S (Sakit)</span>`;
                      } else if (rec.status === "D") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-300 text-[10px] font-extrabold">D (Dispen)</span>`;
                      } else if (rec.status === "A") {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300 text-[10px] font-extrabold">A (Alpha)</span>`;
                      }
                    }

                    return `
                      <div class="p-3.5 rounded-2xl border border-slate-200 bg-white hover:border-emerald-300 transition-colors space-y-2.5">
                        <!-- Baris Atas: Nama Lengkap & Status -->
                        <div class="flex items-start justify-between gap-2">
                          <div>
                            <div class="text-xs sm:text-sm font-extrabold text-slate-900">
                              <span class="text-slate-400 mr-1">${idx + 1}.</span>${s.nama}
                            </div>
                            <div class="text-[11px] text-slate-500 mt-0.5">Kelas ${s.kelas} • Level ${s.level}</div>
                          </div>
                          <div class="shrink-0">${statusBadge}</div>
                        </div>

                        <!-- Baris Bawah: 6 Tombol H, TL, I, S, D, A di bawah nama siswa -->
                        <div class="grid grid-cols-6 gap-1.5 pt-1">
                          ${buttonDefs.map(btn => {
                            const isActive = rec && (
                              (btn.code === "TL" && (rec.isTelat || rec.status === "TL")) ||
                              (btn.code !== "TL" && rec.status === btn.code)
                            );
                            return `
                              <button
                                type="button"
                                onclick="handleAttendanceClick('${s.id}', '${btn.code}')"
                                class="py-2 px-1 rounded-xl border text-center transition-all flex flex-col items-center justify-center ${
                                  isActive
                                    ? btn.activeBg + " shadow-xs font-extrabold"
                                    : "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200 font-bold"
                                }"
                              >
                                <span class="text-xs leading-none">${btn.code}</span>
                                <span class="text-[9px] mt-1 leading-none opacity-90">${btn.label}</span>
                              </button>
                            `;
                          }).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>

                <!-- Footer Kelompok Binaan: Tombol Simpan Absen -->
                <div class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2">
                  <span class="text-[11px] text-slate-500">Pastikan seluruh santri kelompok ini sudah ditandai.</span>
                  <button
                    type="button"
                    onclick="saveKelompokAttendance(${kel.id})"
                    class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-sm transition-colors shrink-0"
                  >
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Simpan Absen</span>
                  </button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    /**
     * =========================================================================
     * 10. MODUL JURNAL KEGIATAN USTADZ (ZIYADAH, MUROJAAH, TIDAK SETORAN)
     * =========================================================================
     */
    function renderJurnalModule() {
      const isApk = uiState.viewportMode === "apk";
      const user = uiState.currentUser;
      const myKelompokId = user.role === "ustadz" ? user.kelompokId : null;
      const siswaOptions = myKelompokId
        ? db.students.filter(s => s.kelompokId === myKelompokId)
        : db.students;

      const selectedSurah = SURAH_LIST[0];
      const recentJurnal = db.jurnal
        .filter(j => !myKelompokId || siswaOptions.some(s => s.id === j.siswaId))
        .slice()
        .reverse()
        .slice(0, 15);

      return `
        <div class="space-y-4">
          <!-- Form Input Jurnal Kegiatan -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-4">
            <div>
              <h2 class="text-sm sm:text-base font-extrabold text-slate-900">Jurnal Kegiatan &amp; Setoran Halaqah</h2>
              <p class="text-xs text-slate-500">Setiap pencatatan kegiatan otomatis memperbarui kehadiran santri menjadi <strong>Hadir (H)</strong> tanpa duplikasi.</p>
            </div>

            <form onsubmit="submitJurnalForm(event)" class="space-y-3">
              <div class="grid ${isApk ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-3"} gap-3">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">Tanggal</label>
                  <input
                    id="jurnal-tanggal"
                    type="date"
                    value="${uiState.selectedDate}"
                    required
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                  />
                </div>

                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">Pilih Santri</label>
                  <select
                    id="jurnal-siswa"
                    required
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
                  >
                    ${siswaOptions.map(s => `<option value="${s.id}" ${s.id === uiState.selectedSiswaId ? "selected" : ""}>${s.nama} (Kelas ${s.kelas} • Kel ${s.kelompokId})</option>`).join("")}
                  </select>
                </div>

                <div>

    function onJurnalJenisChange(val) {
      const wrap = document.getElementById("jurnal-surah-wrapper");
      if (!wrap) return;
      if (val === "Tidak Setoran") {
        wrap.classList.add("hidden");
      } else {
        wrap.classList.remove("hidden");
      }
    }

    function onJurnalSurahChange(suratNo) {
      const sur = SURAH_LIST.find(s => String(s.no) === String(suratNo));
      if (!sur) return;
      const mEl = document.getElementById("jurnal-ayat-mulai");
      const sEl = document.getElementById("jurnal-ayat-selesai");
      if (mEl) { mEl.max = sur.ayat; mEl.value = 1; }
      if (sEl) { sEl.max = sur.ayat; sEl.value = Math.min(5, sur.ayat); }
    }

    function submitJurnalForm(event) {
      event.preventDefault();
      const tanggal = document.getElementById("jurnal-tanggal").value || TODAY_DATE;
      const siswaId = document.getElementById("jurnal-siswa").value;
      const jenis = document.getElementById("jurnal-jenis").value;
      const nasehat = (document.getElementById("jurnal-nasehat").value || "").trim();
      const user = uiState.currentUser;
      const ustadzName = user ? user.name : "Ustadz Pembina";
      const ustadzId = user ? user.username : "ustadz1";

      let suratNo = null;
      let suratNama = "-";
      let ayatMulai = null;
      let ayatSelesai = null;

      if (jenis !== "Tidak Setoran") {
        suratNo = parseInt(document.getElementById("jurnal-surah").value, 10);
        const surObj = SURAH_LIST.find(s => s.no === suratNo);
        suratNama = surObj ? surObj.nama : "An-Nas";
        ayatMulai = parseInt(document.getElementById("jurnal-ayat-mulai").value, 10) || 1;
        ayatSelesai = parseInt(document.getElementById("jurnal-ayat-selesai").value, 10) || ayatMulai;
        if (ayatSelesai < ayatMulai) ayatSelesai = ayatMulai;

        if (jenis === "Ziyadah" && surObj) {
          const isKhatam = ayatSelesai >= surObj.ayat;
          const existingIdx = db.hafalan.findIndex(h => h.siswaId === siswaId && h.suratNo === suratNo);
          const entry = {
            id: `H_${siswaId}_${suratNo}`,
            siswaId,
            suratNo,
            suratNama: surObj.nama,
            ayatMulai: 1,
            ayatSelesai: isKhatam ? surObj.ayat : ayatSelesai,
            totalAyat: isKhatam ? surObj.ayat : ayatSelesai,
            status: isKhatam ? "Khatam" : "Sedang Dihafal",
            tanggal
          };
          if (existingIdx >= 0) db.hafalan[existingIdx] = entry;
          else db.hafalan.push(entry);
        }
      }

      db.jurnal.push({
        id: "J_" + Date.now(),
        tanggal,
        siswaId,
        ustadzId,
        ustadzNama: ustadzName,
        jenis,
        suratNo,
        suratNama,
        ayatMulai,
        ayatSelesai,
        nasehat
      });

      markAutoAttendanceFromJurnal(siswaId, tanggal, ustadzName);
      saveDatabase(db, true);

      const msgDetail = jenis === "Ziyadah"
        ? `Setoran QS. ${suratNama} (${ayatMulai}–${ayatSelesai})`
        : jenis === "Murojaah"
          ? `Murojaah QS. ${suratNama} (${ayatMulai}–${ayatSelesai})`
          : "Hadir tanpa setoran";
      showToast(`Jurnal tersimpan (${msgDetail}) & absen otomatis Hadir (H).`, "success");
      renderApp();
    }

    function filterMultiSurahCheckboxes(keyword) {
      const q = keyword.trim().toLowerCase();
      document.querySelectorAll("#multi-surah-checkbox-list [data-surah-label]").forEach(el => {
        const text = el.getAttribute("data-surah-label") || "";
        el.style.display = !q || text.includes(q) ? "flex" : "none";
      });
    }

    function toggleJuzCheckboxes(juzNumber) {
      const boxes = Array.from(document.querySelectorAll(`input[name="khatam_surah"][data-juz="${juzNumber}"]`));
      const allChecked = boxes.length > 0 && boxes.every(b => b.checked);
      boxes.forEach(b => { b.checked = !allChecked; });
    }

    function onManualSedangSurahChange(suratNo) {
      const sur = SURAH_LIST.find(s => String(s.no) === String(suratNo));
      if (!sur) return;
      const mEl = document.getElementById("manual-sedang-mulai");
      const sEl = document.getElementById("manual-sedang-selesai");
      if (mEl) { mEl.max = sur.ayat; mEl.value = 1; }
      if (sEl) { sEl.max = sur.ayat; sEl.value = 1; }
    }

    function submitManualHafalanForm(event, siswaId) {
      event.preventDefault();
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="khatam_surah"]:checked'));
      const checkedSuratNos = new Set(checkedBoxes.map(cb => parseInt(cb.value, 10)));

      // Hapus data hafalan lama milik santri ini lalu bangun ulang sesuai centang & surat sedang dihafal
      db.hafalan = db.hafalan.filter(h => h.siswaId !== siswaId);

      checkedSuratNos.forEach(no => {
        const sur = SURAH_LIST.find(s => s.no === no);
        if (sur) {
          db.hafalan.push({
            id: `H_${siswaId}_${sur.no}`,
            siswaId,
            suratNo: sur.no,
            suratNama: sur.nama,
            ayatMulai: 1,
            ayatSelesai: sur.ayat,
            totalAyat: sur.ayat,
            status: "Khatam",
            tanggal: TODAY_DATE
          });
        }
      });

      const hasSedang = document.getElementById("manual-has-sedang")?.checked;
      if (hasSedang) {
        const sedangNo = parseInt(document.getElementById("manual-sedang-surah").value, 10);
        if (!checkedSuratNos.has(sedangNo)) {
          const sur = SURAH_LIST.find(s => s.no === sedangNo);
          let mulai = parseInt(document.getElementById("manual-sedang-mulai").value, 10) || 1;
          let selesai = parseInt(document.getElementById("manual-sedang-selesai").value, 10) || mulai;
          if (sur) {
            if (selesai > sur.ayat) selesai = sur.ayat;
            if (selesai < mulai) selesai = mulai;
            db.hafalan.push({
              id: `H_${siswaId}_${sur.no}`,
              siswaId,
              suratNo: sur.no,
              suratNama: sur.nama,
              ayatMulai: mulai,
              ayatSelesai: selesai,
              totalAyat: selesai - mulai + 1,
              status: selesai >= sur.ayat ? "Khatam" : "Sedang Dihafal",
              tanggal: TODAY_DATE
            });
          }
        }
      }

      saveDatabase(db, true);
      closeModal();
      showToast(`Rekap hafalan diperbarui (${checkedSuratNos.size} surat khatam tercatat).`, "success");
      renderApp();
    }

    function deleteHafalanItem(hafalanId) {
      db.hafalan = db.hafalan.filter(h => h.id !== hafalanId);
      saveDatabase(db, true);
      showToast("Entri hafalan dihapus.", "info");
      renderApp();
    }

    /**
     * =========================================================================
     * 12. MODUL REKAP KEHADIRAN TERFILTER (UNTUK PENGGUNA LOGIN)
     * =========================================================================
     */
    function renderRekapModule() {
      return `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button
              type="button"
              onclick="exportRekapCSV()"
              class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold flex items-center gap-1.5"
            >
              <i class="fa-solid fa-file-csv"></i>
              <span>Unduh Rekap Kehadiran CSV</span>
            </button>
          </div>
          ${renderPublicTodayAttendanceSection()}
        </div>
      `;
    }

    /**
     * =========================================================================
     * 13. MODUL SANTRI & WALI SANTRI + DASHBOARD KETUA KOORDINATOR
     * =========================================================================
     */
    function renderSiswaWaliModule() {
      const isApk = uiState.viewportMode === "apk";
      const user = uiState.currentUser;
      const siswaId = user.siswaId || "S001";
      const student = db.students.find(s => s.id === siswaId) || db.students[0];
      const kel = KELOMPOK_LIST.find(k => k.id === student.kelompokId);
      const summary = computeStudentHafalanSummary(student.id);
      const allRanked = getRankedStudentsHafalan();
      const rankObj = allRanked.find(r => r.id === student.id);
      const recToday = getAttendanceRecord(student.id, TODAY_DATE);
      const jurnalList = db.jurnal.filter(j => j.siswaId === student.id).slice().reverse();

      const waUrl = kel
        ? `https://wa.me/${kel.wa}?text=${encodeURIComponent(`Assalamu'alaikum ${kel.ustadzNama}, saya wali/santri dari ${student.nama} (Kelas ${student.kelas} - ${kel.nama}) ingin berkonsultasi mengenai perkembangan tahfidz.`)}`
        : "#";

      return `
        <div class="space-y-4">
          <!-- Profil Santri & Tombol WA Ustadz -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">
                ${kel ? kel.nama : ""} • Level ${student.level}
              </span>
              <h2 class="text-base sm:text-lg font-extrabold text-slate-900 mt-1">${student.nama}</h2>
              <p class="text-xs text-slate-500">Kelas ${student.kelas} • Pembina: <strong>${kel ? kel.ustadzNama : "-"}</strong></p>
            </div>

            <a
              href="${waUrl}"
              target="_blank"
              rel="noopener noreferrer"
              class="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold flex items-center gap-2 shadow-sm"
            >
              <i class="fa-brands fa-whatsapp text-sm"></i>
              <span>Chat WA Ustadz Pembina</span>
            </a>
          </div>

          <!-- Ringkasan Kehadiran Hari Ini & Capaian Hafalan -->
          <div class="grid ${isApk ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-4"} gap-3">
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500">Kehadiran Hari Ini</div>
              <div class="text-base font-extrabold text-emerald-800 mt-1">
                ${recToday ? (recToday.status === "H" && recToday.isTelat ? "Hadir (Telat)" : recToday.status) : "Belum Diabsen"}
              </div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500">Peringkat Global</div>
              <div class="text-xl font-extrabold text-amber-600 mt-0.5">#${rankObj ? rankObj.rank : "-"}</div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500">Surat Khatam</div>
              <div class="mt-1 flex items-center gap-1.5">
                <button
                  type="button"
                  onclick="openKhatamDetailModal('${student.id}')"
                  class="px-2.5 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold"
                >
                  ${summary.khatamCount} Surat
                </button>
                <span class="text-[10px] italic text-slate-500">klik untuk melihat</span>
              </div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500">Total Ayat Terhafal</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5">${summary.totalAyat} Ayat</div>
            </div>
          </div>

          <!-- Riwayat Setoran & Nasehat Ustadz -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-3">
            <h3 class="text-xs sm:text-sm font-extrabold text-slate-900">Catatan Setoran &amp; Nasehat Ustadz Pembina</h3>
            ${jurnalList.length === 0 ? `
              <p class="text-xs text-slate-400">Belum ada catatan jurnal untuk santri ini.</p>
            ` : `
              <div class="space-y-2.5">
                ${jurnalList.map(j => `
                  <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-1 text-xs">
                    <div class="flex items-center justify-between">
                      <span class="font-extrabold text-emerald-900">
                        ${j.jenis === "Ziyadah" ? `Setoran: QS. ${j.suratNama} Ayat ${j.ayatMulai}–${j.ayatSelesai}` : j.jenis === "Murojaah" ? `Murojaah: QS. ${j.suratNama} Ayat ${j.ayatMulai}–${j.ayatSelesai}` : "Hadir (Tidak Setoran)"}
                      </span>
                      <span class="text-[11px] text-slate-400">${j.tanggal}</span>
                    </div>
                    ${j.nasehat ? `<p class="text-slate-700 italic">"${j.nasehat}"</p>` : ""}
                    <div class="text-[10px] text-slate-500">Dicatat oleh ${j.ustadzNama}</div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function openMutasiModal(siswaId) {
      const student = db.students.find(s => s.id === siswaId);
      if (!student) return;
      openModal(`
        <form onsubmit="submitMutasiForm(event, '${siswaId}')" class="p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
              <h3 class="text-sm font-extrabold text-slate-900">Mutasi Kelompok &amp; Level Santri</h3>
              <p class="text-xs text-slate-500">${student.nama} (Kelas ${student.kelas})</p>
            </div>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div>
            <label class="block text-xs font-extrabold text-slate-700 mb-1">Pilih Kelompok &amp; Level Baru</label>
            <select id="mutasi-kelompok" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white">
              ${KELOMPOK_LIST.map(k => `
                <option value="${k.id}" ${k.id === student.kelompokId ? "selected" : ""}>
                  ${k.nama} — Level ${k.level} (${k.ustadzNama})
                </option>
              `).join("")}
            </select>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold">Simpan Mutasi</button>
          </div>
        </form>
      `);
    }

    function submitMutasiForm(event, siswaId) {
      event.preventDefault();
      const newKelId = parseInt(document.getElementById("mutasi-kelompok").value, 10);
      const st = db.students.find(s => s.id === siswaId);
      const kelObj = KELOMPOK_LIST.find(k => k.id === newKelId);
      if (st && kelObj) {
        st.kelompokId = kelObj.id;
        st.level = kelObj.level;
        saveDatabase(db, true);
        showToast(`${st.nama} berhasil dimutasi ke ${kelObj.nama} (Level ${kelObj.level}).`, "success");
      }
      closeModal();
      renderApp();
    }

    function renderKoordinatorDashboard() {
      const isApk = uiState.viewportMode === "apk";
      const totalSiswa = db.students.length;
      const kls7 = db.students.filter(s => s.jenjang === 7).length;
      const kls8 = db.students.filter(s => s.jenjang === 8).length;
      const kls9 = db.students.filter(s => s.jenjang === 9).length;
      const isSheetsConnected = Boolean(sheetsConfig.scriptUrl);

      return `
        <div class="space-y-4">
          <!-- Panel Koneksi & Sinkronisasi Google Spreadsheet (Khusus Koordinator) -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border ${isSheetsConnected ? "border-emerald-300" : "border-amber-300"} shadow-xs space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl ${isSheetsConnected ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"} flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-file-excel text-base"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="text-xs sm:text-sm font-extrabold text-slate-900">Database Google Spreadsheet</h3>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                      isSheetsConnected
                        ? "bg-emerald-100 text-emerald-800 border border-emerald-300"
                        : "bg-amber-100 text-amber-900 border border-amber-300"
                    }">
                      ${isSheetsConnected ? "Terhubung" : "Belum Terhubung"}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-500">
                    ${isSheetsConnected
                      ? `Sinkron terakhir: <strong>${sheetsConfig.lastSyncAt || "Baru terhubung"}</strong> • Edit data di Sheets lalu klik Tarik dari Sheets.`
                      : "Hubungkan ke Google Spreadsheet agar data 103 siswa, absensi, dan hafalan tersimpan terpusat."}
                  </p>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <button
                  type="button"
                  onclick="openGoogleSheetsSetupModal()"
                  class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-code"></i>
                  <span>Atur URL &amp; Script</span>
                </button>
                ${isSheetsConnected ? `
                  <button
                    type="button"
                    onclick="pushDataToGoogleSheets(false)"
                    class="px-3 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold flex items-center gap-1.5"
                  >
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Kirim ke Sheets</span>
                  </button>
                  <button
                    type="button"
                    onclick="pullDataFromGoogleSheets(false)"
                    class="px-3 py-2 rounded-xl bg-sky-700 hover:bg-sky-800 text-white text-xs font-extrabold flex items-center gap-1.5"
                  >
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>Tarik dari Sheets</span>
                  </button>
                ` : ""}
              </div>
            </div>
          </div>

          <!-- Ringkasan Statistik Matriks -->
          <div class="grid ${isApk ? "grid-cols-2" : "grid-cols-2 md:grid-cols-4"} gap-3">
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500 uppercase">Total Santri</div>
              <div class="text-2xl font-extrabold text-emerald-800 mt-1">${totalSiswa}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">Kls 7: ${kls7} • Kls 8: ${kls8} • Kls 9: ${kls9}</div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500 uppercase">Ustadz Pembina</div>
              <div class="text-2xl font-extrabold text-slate-900 mt-1">8 Ustadz</div>
              <div class="text-[11px] text-slate-500 mt-0.5">8 Kelompok Halaqah</div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500 uppercase">Level Kemampuan</div>
              <div class="text-2xl font-extrabold text-amber-600 mt-1">3 Level</div>
              <div class="text-[11px] text-slate-500 mt-0.5">Campuran Kls 7, 8, 9</div>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs">
              <div class="text-[11px] font-bold text-slate-500 uppercase">Tim Koordinator</div>
              <div class="text-2xl font-extrabold text-sky-700 mt-1">1 + 2</div>
              <div class="text-[11px] text-slate-500 mt-0.5">1 Ketua + 2 Tim Absensi</div>
            </div>
          </div>

          <!-- Pemetaan 8 Kelompok & 3 Level -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-3">
            <h3 class="text-sm font-extrabold text-slate-900">Pemetaan 8 Kelompok Halaqah &amp; 3 Level</h3>
            <div class="grid ${isApk ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-2 lg:grid-cols-4"} gap-3">
              ${KELOMPOK_LIST.map(k => {
                const members = db.students.filter(s => s.kelompokId === k.id);
                const c7 = members.filter(m => m.jenjang === 7).length;
                const c8 = members.filter(m => m.jenjang === 8).length;
                const c9 = members.filter(m => m.jenjang === 9).length;
                return `
                  <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70 space-y-1.5">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold text-slate-900">${k.nama}</span>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold border ${LEVEL_INFO[k.level].badge}">Level ${k.level}</span>
                    </div>
                    <div class="text-xs font-bold text-emerald-800">${k.ustadzNama}</div>
                    <div class="text-[11px] text-slate-600">Total: <strong>${members.length} siswa</strong> (7:${c7}, 8:${c8}, 9:${c9})</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Daftar 103 Siswa & Mutasi Level -->
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h3 class="text-sm font-extrabold text-slate-900">Direktori 103 Siswa &amp; Mutasi Kelompok/Level</h3>
              <input
                type="text"
                value="${uiState.searchQuery}"
                oninput="uiState.searchQuery = this.value; renderApp();"
                placeholder="Cari nama / kelas siswa..."
                class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white"
              />
            </div>

            <div class="max-h-96 overflow-y-auto divide-y divide-slate-100">
              ${getFilteredStudentsForRekap().map((s, idx) => {
                const kel = KELOMPOK_LIST.find(k => k.id === s.kelompokId);
                return `
                  <div class="py-2.5 flex items-center justify-between gap-2 text-xs">
                    <div>
                      <span class="text-slate-400 font-bold mr-1">${idx + 1}.</span>
                      <span class="font-extrabold text-slate-900">${s.nama}</span>
                      <span class="ml-1.5 px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-bold text-[10px]">Kelas ${s.kelas}</span>
                      <div class="text-[11px] text-slate-500 mt-0.5">
                        ${kel ? kel.nama : ""} • Level ${s.level} • ${kel ? kel.ustadzNama : ""}
                      </div>
                    </div>
                    <button
                      type="button"
                      onclick="openMutasiModal('${s.id}')"
                      class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold text-[11px] shrink-0"
                    >
                      Mutasi Level
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =========================================================================
     * 14. SHELL NAVIGASI PENGGUNA LOGIN & RENDER UTAMA
     * =========================================================================
     */
    function renderAuthenticatedShell() {
      const isApk = uiState.viewportMode === "apk";
      const user = uiState.currentUser;

      let navItems = [];
      if (user.role === "koordinator") {
        navItems = [
          { id: "dashboard", label: "Dashboard & Siswa", icon: "fa-chart-pie" },
          { id: "absensi", label: "Absensi", icon: "fa-clipboard-check" },
          { id: "jurnal", label: "Jurnal", icon: "fa-book-open" },
          { id: "hafalan", label: "Hafalan & Ranking", icon: "fa-trophy" },
          { id: "rekap", label: "Rekap Kehadiran", icon: "fa-table-list" }
        ];
      } else if (user.role === "tim_koordinator") {
        navItems = [
          { id: "absensi", label: "Absensi Siswa", icon: "fa-clipboard-check" },
          { id: "rekap", label: "Rekap Kehadiran", icon: "fa-table-list" },
          { id: "hafalan_global", label: "Ranking Hafalan", icon: "fa-trophy" }
        ];
      } else if (user.role === "ustadz") {
        navItems = [
          { id: "jurnal", label: "Jurnal Kegiatan", icon: "fa-book-open" },
          { id: "hafalan", label: "Hafalan & Ranking", icon: "fa-trophy" },
          { id: "absensi", label: "Absensi", icon: "fa-clipboard-check" },
          { id: "rekap", label: "Rekap Kehadiran", icon: "fa-table-list" }
        ];
      } else {
        navItems = [
          { id: "hafalan_saya", label: "Hafalan & Nasehat", icon: "fa-book-quran" },
          { id: "hafalan_global", label: "Ranking Hafalan", icon: "fa-trophy" },
          { id: "rekap", label: "Rekap Kehadiran", icon: "fa-table-list" }
        ];
      }

      if (!navItems.some(n => n.id === uiState.activeTab)) {
        uiState.activeTab = navItems[0].id;
      }

      let contentHtml = "";
      if (uiState.activeTab === "dashboard") contentHtml = renderKoordinatorDashboard();
      else if (uiState.activeTab === "absensi") contentHtml = renderAttendanceModule();
      else if (uiState.activeTab === "jurnal") contentHtml = renderJurnalModule();
      else if (uiState.activeTab === "hafalan") contentHtml = renderRekapHafalanUstadzModule();
      else if (uiState.activeTab === "hafalan_global") contentHtml = renderGlobalHafalanRankingSection();
      else if (uiState.activeTab === "rekap") contentHtml = renderRekapModule();
      else if (uiState.activeTab === "hafalan_saya") contentHtml = renderSiswaWaliModule();

      return `
        <div class="${isApk ? "p-3 space-y-3.5" : "max-w-6xl mx-auto px-4 py-5 space-y-4"}">
          <!-- Header Akun Aktif -->
          <div class="bg-white rounded-3xl p-3.5 sm:p-4 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-emerald-700 text-white flex items-center justify-center font-extrabold text-sm shrink-0">
                ${user.name.charAt(0)}
              </div>
              <div>
                <div class="text-xs sm:text-sm font-extrabold text-slate-900">${user.name}</div>
                <div class="text-[11px] text-emerald-700 font-bold">${user.title}</div>
              </div>
            </div>

            <button
              type="button"
              onclick="logout()"
              class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-extrabold flex items-center gap-1.5"
            >
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Keluar</span>
            </button>
          </div>

          <!-- Navigasi Menu -->
          <nav class="flex gap-1.5 overflow-x-auto pb-1">
            ${navItems.map(item => `
              <button
                type="button"
                onclick="switchTab('${item.id}')"
                class="px-3.5 py-2.5 rounded-2xl text-xs font-extrabold flex items-center gap-2 whitespace-nowrap transition-all ${
                  uiState.activeTab === item.id
                    ? "bg-emerald-700 text-white shadow-sm"
                    : "bg-white text-slate-600 hover:text-slate-900 border border-slate-200"
                }"
              >
                <i class="fa-solid ${item.icon}"></i>
                <span>${item.label}</span>
              </button>
            `).join("")}
          </nav>

          <!-- Konten Modul Aktif -->
          ${contentHtml}
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      if (!uiState.currentUser) {
        root.innerHTML = renderLoginPage();
      } else {
        root.innerHTML = renderAuthenticatedShell();
      }
    }

    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
